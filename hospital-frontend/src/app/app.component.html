<!-- Show full layout only when logged in -->
<div class="wrapper" *ngIf="isLoggedIn; else loginLayout">
  <!-- Sidebar -->
  <nav id="sidebar">
      <div class="sidebar-header">
          <i class="bi bi-hospital"></i>
          <h4>Hospital MS</h4>
      </div>

      <ul class="list-unstyled components">
          <li *ngIf="canSee('dashboard')">
              <a routerLink="/dashboard" routerLinkActive="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
          </li>
          <li *ngIf="canSee('patients')">
              <a routerLink="/patients" routerLinkActive="active"><i class="bi bi-people"></i> Patients</a>
          </li>
          <li *ngIf="canSee('medecins')">
              <a routerLink="/medecins" routerLinkActive="active"><i class="bi bi-file-medical"></i> Médecins</a>
          </li>
          <li *ngIf="canSee('consultations')">
              <a routerLink="/consultations" routerLinkActive="active"><i class="bi bi-clipboard2-pulse"></i> Consultations</a>
          </li>
          <li *ngIf="canSee('rendezvous')">
              <a routerLink="/rendezvous" routerLinkActive="active"><i class="bi bi-calendar-check"></i> Rendez-vous</a>
          </li>
      </ul>

      <div class="sidebar-footer">
          <div class="user-info-mini">
              <i class="bi bi-person-circle"></i>
              <div>
                  <span class="username">{{ username }}</span>
                  <span class="role-badge" [ngClass]="roleBadgeClass">{{ roleLabel }}</span>
              </div>
          </div>
      </div>
  </nav>

  <!-- Page Content -->
  <div id="content">
      <nav class="navbar navbar-expand-lg navbar-light bg-white rounded shadow-sm mb-4">
          <div class="container-fluid">
              <span class="navbar-brand mb-0 h1">
                  <span class="page-role-label" [ngClass]="roleBadgeClass">{{ roleLabel }}</span>
                  Panel
              </span>
              <div class="d-flex align-items-center">
                  <span class="navbar-username me-3">
                      <i class="bi bi-person-circle"></i> {{ username }}
                  </span>
                  <button class="btn btn-outline-danger btn-sm" (click)="logout()" id="logoutBtn">
                      <i class="bi bi-box-arrow-right"></i> Logout
                  </button>
              </div>
          </div>
      </nav>

      <!-- Main Router Outlet -->
      <main class="fade-in">
          <router-outlet></router-outlet>
      </main>
  </div>
</div>

<!-- Login layout: no sidebar, just router outlet -->
<ng-template #loginLayout>
  <router-outlet></router-outlet>
</ng-template>
